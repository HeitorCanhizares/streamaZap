<script type="text/x-dc" data-dc-script="" data-props="{&quot;scene&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;game&quot;,&quot;race&quot;,&quot;movie&quot;,&quot;code&quot;,&quot;desktop&quot;,&quot;cama&quot;,&quot;camb&quot;,&quot;camc&quot;,&quot;camd&quot;],&quot;default&quot;:&quot;game&quot;},&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:180}}">
class Component extends DCLogic {
  renderVals() {
    const scene = this.props.scene ?? 'game';
    const cams = {
      cama: ['#1E3A2E', '#3B6B55', '#3BF08A'],
      camb: ['#3A2A1E', '#6B4F36', '#FFB547'],
      camc: ['#1E2C3F', '#3E5878', '#5CD6FF'],
      camd: ['#2E2340', '#57457A', '#FF8FB1']
    };
    const cam = cams[scene] || cams.cama;
    return {
      isGame: scene === 'game',
      isRace: scene === 'race',
      isMovie: scene === 'movie',
      isCode: scene === 'code',
      isDesktop: scene === 'desktop',
      isCam: !!cams[scene],
      camBg: cam[0],
      camFig: cam[1],
      camLamp: cam[2]
    };
  }
}
</script>
