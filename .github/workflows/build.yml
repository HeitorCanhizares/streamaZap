name: Build & Release

# Toda build gera o instalador do Windows. Quando a build é do branch master
# (ou main, ou de uma tag v*), ela vira automaticamente uma Release no GitHub, que é de
# onde o app baixa as atualizações.
#
# Versão:
#   * push no master/main       -> MAJOR.MINOR (de streamazap/__init__.py) + número da build
#                                 ex.: __version__ = "0.1.0", build 42 -> 0.1.42
#   * tag v1.2.3               -> 1.2.3
#   * "Run workflow" manual    -> versão digitada (ou automática se deixar vazio)
#   * outros branches          -> só build (instalador fica nos artifacts), sem Release
#
# Para não publicar um push específico, coloque [skip release] na mensagem do commit.
# Para subir MAJOR/MINOR, edite __version__ em streamazap/__init__.py.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      version:
        description: "Versão (ex.: 1.2.3). Deixe vazio para gerar automaticamente."
        required: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Definir versão
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          BASE=$(sed -n 's/^__version__ = "\([0-9]*\.[0-9]*\).*/\1/p' streamazap/__init__.py)
          AUTO="$BASE.${{ github.run_number }}"
          RELEASE=false
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            RELEASE=true
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION#v}"
            VERSION="${VERSION:-$AUTO}"
            RELEASE=true
          elif [ "$GITHUB_REF_NAME" = "master" ] || [ "$GITHUB_REF_NAME" = "main" ]; then
            VERSION="$AUTO"
            RELEASE=true
            case "$COMMIT_MESSAGE" in *"[skip release]"*) RELEASE=false ;; esac
          else
            VERSION="$AUTO-dev"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.]+)?$ ]]; then
            echo "Versão inválida: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          sed -i "s/^__version__ = .*/__version__ = \"$VERSION\"/" streamazap/__init__.py
          echo "Versão $VERSION (release: $RELEASE)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Testes
        run: pytest -q

      - name: Gerar ícones
        run: |
          pip install pillow
          python packaging/make_icon.py

      - name: Gerar executável (PyInstaller)
        run: pyinstaller packaging/streamazap.spec --noconfirm

      - name: Pacote portátil (.zip)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer | Out-Null
          Compress-Archive -Path dist/StreamaZap/* -DestinationPath "installer/StreamaZap-${{ steps.version.outputs.version }}-portable.zip"

      - name: Gerar instalador (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: StreamaZap-${{ steps.version.outputs.version }}
          path: installer/*

      - name: Publicar release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: StreamaZap ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: installer/*
