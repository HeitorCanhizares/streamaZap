name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff
      - name: Lint
        run: ruff check .
      - name: Testes
        run: pytest -v
      - name: Smoke test das APIs do Windows
        if: runner.os == 'Windows'
        run: |
          python -c "from streamazap.capture.screen import list_monitors, list_windows, create_capturer; m = list_monitors(); print(m); f = create_capturer(m[0]).grab(); print(f.shape); print(len(list_windows()), 'janelas')"
          python -c "import logging, time; logging.basicConfig(level=logging.INFO); from streamazap.capture.screen import list_monitors, create_capturer, _win; m = list_monitors()[0]; caps = [create_capturer(m), _win.MonitorCapturer(*m.rect)]; ms = lambda c: -time.perf_counter() + (c.grab() is None or time.perf_counter()); [print('captura', c.backend, round(sum(ms(c) for _ in range(30)) / 30 * 1000, 2), 'ms/quadro', 'gpu' if getattr(c, '_staged', False) else '') for c in caps]"
          python -c "import streamazap.capture.audio_win; from streamazap.capture.audio import audio_supported, list_audio_apps; print('audio:', audio_supported(), list_audio_apps())"
          python -c "import sys; from streamazap import firewall as f; r = f._run_powershell(f.CHECK_SCRIPT.format(program=f._ps_quote(sys.executable))); print(repr(r.stdout), r.stderr[:500]); print(f.parse_check_output(r.stdout))"
          python -c "import sounddevice as sd; from streamazap.player import _wasapi_output; print('wasapi:', _wasapi_output(sd))"
