name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff
      - name: Lint
        run: ruff check .
      - name: Testes
        run: pytest -v
      - name: Smoke test das APIs do Windows
        if: runner.os == 'Windows'
        run: |
          python -c "from streamazap.capture.screen import list_monitors, list_windows, create_capturer; m = list_monitors(); print(m); f = create_capturer(m[0]).grab(); print(f.shape); print(len(list_windows()), 'janelas')"
          python -c "import streamazap.capture.audio_win; from streamazap.capture.audio import audio_supported, list_audio_apps; print('audio:', audio_supported(), list_audio_apps())"
