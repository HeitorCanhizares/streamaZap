[workspace]
resolver = "2"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "3.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/HeitorCanhizares/streamaZap"

[workspace.dependencies]
# crates do projeto
zap-proto = { path = "crates/zap-proto" }
zap-rate = { path = "crates/zap-rate" }
zap-net = { path = "crates/zap-net" }
zap-media = { path = "crates/zap-media" }
zap-gpu = { path = "crates/zap-gpu" }
zap-capture = { path = "crates/zap-capture" }
zap-encode = { path = "crates/zap-encode" }
zap-audio = { path = "crates/zap-audio" }
zap-test-server = { path = "crates/zap-test-server" }
zap-sys = { path = "crates/zap-sys" }
zap-core = { path = "crates/zap-core" }

# base
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
crossbeam-channel = "0.5"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.9"

# criptografia e codificação
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"

# rede
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rcgen = "0.14"
webpki-roots = "1"
socket2 = { version = "0.6", features = ["all"] }
# modo Online (M4): cliente da API e servidor de teste
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
axum = { version = "0.8", features = ["ws"] }
if-addrs = "0.15"

# mídia (M2)
rtrb = "0.3"
rubato = "0.16"
cpal = "0.16"
opus = "0.3"
windows = "0.62"
windows-core = "0.62"

# app (M3)
tauri = { version = "2", features = [] }
tauri-build = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"

# testes
proptest = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

# Sem isto o target/ passa de 25 GB (informação de depuração completa em cada binário de teste).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

# Conversor de CPU (laços de pixel): sem otimização os testes do caminho da CPU ficam lentos demais.
[profile.dev.package.zap-gpu]
opt-level = 3
